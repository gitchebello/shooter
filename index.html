<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shooter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{--ink:#140a1f;--paper:#fff6e3;--pink:#ff4fa3;--cyan:#2de2e6;--yellow:#ffd23f;--violet:#9b5cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0514;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;font-family:'Luckiest Guy',Impact,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
@supports (height:100dvh){#stage{width:min(100vw,calc(100dvh*16/9));height:min(100dvh,calc(100vw*9/16))}}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.pbtn{position:absolute;border:4px solid var(--ink);color:var(--paper);font-family:inherit;cursor:pointer;padding:0;outline:none;
  text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);
  box-shadow:6px 8px 0 rgba(26,6,48,.6),inset -7px -9px 0 rgba(0,0,0,.22),inset 5px 5px 0 rgba(255,255,255,.4);
  transition:transform .1s cubic-bezier(.3,1.7,.5,1),box-shadow .1s,filter .1s}
#fire{right:3.2%;bottom:6%;width:clamp(76px,10.5%,150px);aspect-ratio:1;border-radius:50%;background:var(--yellow);
  font-size:clamp(12px,1.45vw,21px);line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  animation:bob 1.7s cubic-bezier(.45,0,.55,1) infinite;filter:drop-shadow(0 0 14px rgba(255,210,63,.6))}
#fire b,.sbtn b{font-size:2.1em;line-height:.9;font-family:'Segoe UI Symbol','Noto Sans Symbols',sans-serif}
#fire.down{animation:none;transform:translate(4px,6px) scale(1.12,.86);
  box-shadow:2px 2px 0 rgba(26,6,48,.6),inset -7px -9px 0 rgba(0,0,0,.22),inset 5px 5px 0 rgba(255,255,255,.4);
  filter:drop-shadow(0 0 28px rgba(255,210,63,1)) brightness(1.15)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}
.sbtn{display:none;aspect-ratio:1;border-radius:50%;font-size:clamp(8px,.95vw,14px);line-height:1;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.touch .sbtn{display:flex}
.sbtn b{font-size:1.7em}
#ex{right:15%;bottom:5%;width:clamp(58px,7.4%,108px);background:var(--cyan)}
#parry{right:5.2%;bottom:28%;width:clamp(54px,6.6%,96px);background:var(--pink)}
#swap{right:15.6%;bottom:24%;width:clamp(46px,5.4%,80px);background:var(--violet)}
.sbtn.down,#pad .pbtn.down{transform:translate(3px,4px) scale(.92);box-shadow:2px 2px 0 rgba(26,6,48,.6),inset -7px -9px 0 rgba(0,0,0,.22)}
#pad{position:absolute;left:3%;bottom:6%;width:clamp(120px,17%,210px);aspect-ratio:1;display:none}
.touch #pad{display:block}
#pad .pbtn{width:34%;height:34%;border-radius:24%;background:var(--cyan);font-size:clamp(14px,1.8vw,26px)}
#pad .u{left:33%;top:0}#pad .d{left:33%;bottom:0}#pad .l{left:0;top:33%}#pad .r{right:0;top:33%}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="pad">
    <button class="pbtn u" data-k="ArrowUp" tabindex="-1" aria-label="Cima">▲</button>
    <button class="pbtn l" data-k="ArrowLeft" tabindex="-1" aria-label="Esquerda">◀</button>
    <button class="pbtn r" data-k="ArrowRight" tabindex="-1" aria-label="Direita">▶</button>
    <button class="pbtn d" data-k="ArrowDown" tabindex="-1" aria-label="Baixo">▼</button>
  </div>
  <button id="fire" class="pbtn" tabindex="-1" aria-label="Tocar"><b>♪</b>TOCAR</button>
  <button id="ex" class="pbtn sbtn" tabindex="-1" aria-label="Especial"><b>★</b>ESPECIAL</button>
  <button id="parry" class="pbtn sbtn" tabindex="-1" aria-label="Parry"><b>♥</b>PARRY</button>
  <button id="swap" class="pbtn sbtn" tabindex="-1" aria-label="Trocar acorde"><b>♯</b>ACORDE</button>
</div>
<script>
(()=>{
'use strict';
// ============================================================ constantes
const W=1280,H=720,INK='#140a1f',PAPER='#fff6e3',SHC='#1a0630',SHX=9,SHY=11,MAXV=520;
const TAU=Math.PI*2;
const FONT='"Luckiest Guy", Impact, "Arial Black", sans-serif';
const C={pink:'#ff4fa3',cyan:'#2de2e6',yellow:'#ffd23f',lime:'#8aff5c',orange:'#ff8a3d',violet:'#9b5cff',red:'#ff3b5c',sky:'#7fc8ff'};
const NEON=[C.pink,C.cyan,C.yellow,C.lime,C.violet,C.orange];
const PP={paper:['#fff6e3','#e3cfa8'],pink:['#ff6fb5','#c8317e'],cyan:['#5ff0f2','#1fa3b8'],yellow:['#ffd84a','#e08a1e'],
  lime:['#a6ff6e','#3fae3a'],violet:['#a77bff','#6a3fd0'],orange:['#ff9a4d','#cc4f1f'],blush:['#ffd0e6','#e48ab4'],
  sky:['#cfefff','#7fb6e0'],lemon:['#fff3a6','#e0c25a'],gold:['#ffd84a','#c9821a'],silver:['#eef2ff','#93a0c4'],wood:['#ff9a4d','#b8521f']};
const GW='#fffdf7',GS='#d4cae4';   // luva branca de desenho animado
// cores dos projéteis inimigos: rosa = dá pra dar parry
const EB_COL=['#ff5a36','#b8321c'],EB_PINK=['#ff6fd0','#c42e94'];

const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
const wrap=(v,m)=>((v%m)+m)%m;
const normA=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;};
// curvas de easing (slow-in / slow-out, overshoot, elástico)
const E={
  outBack:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
  inBack:t=>{const c1=1.70158;return (c1+1)*t*t*t-c1*t*t;},
  inOutSine:t=>-(Math.cos(Math.PI*t)-1)/2,
  outCubic:t=>1-Math.pow(1-t,3), inCubic:t=>t*t*t,
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
};
function hash(n){n|=0;n=Math.imul(n^(n>>>16),0x45d9f3b);n=Math.imul(n^(n>>>16),0x45d9f3b);n^=n>>>16;return (n>>>0)/4294967296;}
const sr=(seed,k)=>hash(Math.floor(seed)*374761393+k*668265263+1013);
// curva de bézier quadrática (arcos de movimento)
const bz=(a,b,c,t)=>{const u=1-t;return [u*u*a[0]+2*u*t*b[0]+t*t*c[0],u*u*a[1]+2*u*t*b[1]+t*t*c[1]];};

// ============================================================ canvas
const stage=document.getElementById('stage'), view=document.getElementById('view');
const scene=document.createElement('canvas'), sceneCtx=scene.getContext('2d');let g=sceneCtx;
const hudCv=document.createElement('canvas'), hudCtx=hudCv.getContext('2d');
const shadowCv=document.createElement('canvas'), sg=shadowCv.getContext('2d');
let RS=1, post=null, vctx=null;

function resize(){
  const r=stage.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  view.width=Math.max(2,Math.round(r.width*dpr)); view.height=Math.max(2,Math.round(r.height*dpr));
  RS=clamp(view.height/H,1,1.5);
  scene.width=shadowCv.width=hudCv.width=Math.round(W*RS); scene.height=shadowCv.height=hudCv.height=Math.round(H*RS);
}

// ============================================================ texturas
function makePaperTex(){
  const s=384,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  x.fillStyle='#efe2c6';x.fillRect(0,0,s,s);
  const tiled=fn=>{for(const ox of [-s,0,s])for(const oy of [-s,0,s]){x.save();x.translate(ox,oy);fn();x.restore();}};
  // papel machê: retalhos rasgados sobrepostos
  for(let i=0;i<70;i++){
    const px=rand(0,s),py=rand(0,s),rot=rand(0,TAU),w=rand(30,95),h=rand(14,42),a=rand(.1,.26),col=Math.random()<.5?'#fffaf0':'#c9ad80';
    const jit=[];for(let k=0;k<18;k++)jit.push(rand(-3.5,3.5));
    tiled(()=>{x.translate(px,py);x.rotate(rot);x.globalAlpha=a;x.fillStyle=col;x.beginPath();x.moveTo(-w/2,-h/2);
      for(let k=0;k<=8;k++)x.lineTo(-w/2+w*k/8,-h/2+jit[k]);for(let k=0;k<=8;k++)x.lineTo(w/2-w*k/8,h/2+jit[9+k]);x.closePath();x.fill();});
  }
  // fibras
  x.lineCap='round';
  for(let i=0;i<650;i++){
    const px=rand(0,s),py=rand(0,s),a=rand(0,TAU),l=rand(4,16),bend=rand(-4,4),dark=Math.random()<.55;
    tiled(()=>{x.globalAlpha=dark?.16:.35;x.strokeStyle=dark?'#7a5a3a':'#ffffff';x.lineWidth=rand(.6,1.4);x.beginPath();x.moveTo(px,py);
      x.quadraticCurveTo(px+Math.cos(a)*l/2+bend,py+Math.sin(a)*l/2+bend,px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke();});
  }
  x.globalAlpha=1;
  const id=x.getImageData(0,0,s,s),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*38;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  x.putImageData(id,0,0);
  return c;
}
const paperTex=makePaperTex();
let paperPat=null;

const glowCache={};
function glowSprite(col){
  let s=glowCache[col]; if(s) return s;
  s=document.createElement('canvas');s.width=s.height=128;const x=s.getContext('2d');
  const gr=x.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,col);gr.addColorStop(.22,col+'aa');gr.addColorStop(.55,col+'33');gr.addColorStop(1,col+'00');
  x.fillStyle=gr;x.fillRect(0,0,128,128);return glowCache[col]=s;
}

// ============================================================ desenho em papel
let X=g, SHD=false, FLASH=false, BOIL=0, BC=0;
// peça de papel: preenchimento + sombra dura recortada + contorno grosso que "ferve" a 12 quadros/s, como traço de animação à mão
function piece(p,fill,shade,cut,lw,lr){
  if(SHD){X.fillStyle=SHC;X.fill(p);X.lineWidth=lw||4;X.strokeStyle=SHC;X.stroke(p);return;}
  if(FLASH){X.fillStyle='#fff';X.fill(p);}
  else{
    X.fillStyle=fill;X.fill(p);
    if(shade){X.save();X.clip(p);if(lr)X.rotate(lr);X.fillStyle=shade;X.fillRect(-600,cut||0,1200,1200);X.restore();}
  }
  const k=BC++,jx=(hash(BOIL*977+k*131)-.5)*1.4,jy=(hash(BOIL*613+k*71+5)-.5)*1.4;
  X.lineWidth=lw||4;X.strokeStyle=INK;X.translate(jx,jy);X.stroke(p);X.translate(-jx,-jy);
}
function drawGlow(x,y,r,col,a){
  if(SHD) return;
  X.save();X.globalCompositeOperation='lighter';X.globalAlpha=a;X.drawImage(glowSprite(col),x-r,y-r,r*2,r*2);X.restore();
}
function starPath(ro,ri,n=5){
  const p=new Path2D();
  for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?ri:ro;i?p.lineTo(Math.cos(a)*r,Math.sin(a)*r):p.moveTo(Math.cos(a)*r,Math.sin(a)*r);}
  p.closePath();return p;
}
function rrect(x,y,w,h,r){const p=new Path2D();p.moveTo(x+r,y);p.arcTo(x+w,y,x+w,y+h,r);p.arcTo(x+w,y+h,x,y+h,r);p.arcTo(x,y+h,x,y,r);p.arcTo(x,y,x+w,y,r);p.closePath();return p;}
const STAR_UNIT=starPath(1,.45);
const SPIRAL=(()=>{const p=new Path2D();const N=60,T=4.5*Math.PI;for(let i=0;i<=N;i++){const a=i/N*T,r=a/T;i?p.lineTo(Math.cos(a)*r,Math.sin(a)*r):p.moveTo(0,0);}return p;})();
const TRI=(()=>{const p=new Path2D();p.moveTo(0,-1);p.lineTo(.9,.7);p.lineTo(-.9,.6);p.closePath();return p;})();
const QUAD=(()=>{const p=new Path2D();p.moveTo(-.9,-.7);p.lineTo(.8,-.9);p.lineTo(.9,.6);p.lineTo(-.7,.9);p.closePath();return p;})();
const DROP=(()=>{const p=new Path2D();p.moveTo(15,0);p.bezierCurveTo(4,-4,-2,-8,-6,-8);p.arc(-6,0,8,-Math.PI/2,Math.PI/2,true);p.bezierCurveTo(-2,8,4,4,15,0);p.closePath();return p;})();
const ROCK=(()=>{const p=new Path2D();for(let i=0;i<9;i++){const a=i/9*TAU,r=11*(.8+.35*hash(i*7+3));i?p.lineTo(Math.cos(a)*r,Math.sin(a)*r):p.moveTo(r,0);}p.closePath();return p;})();
function tornRect(x,y,w,h,seed){
  const p=new Path2D();p.moveTo(x,y);
  for(let i=1;i<=10;i++)p.lineTo(x+w*i/10,y+(sr(seed,i)-.5)*5);
  for(let i=1;i<=3;i++)p.lineTo(x+w+(sr(seed,20+i)-.5)*6,y+h*i/3);
  for(let i=9;i>=0;i--)p.lineTo(x+w*i/10,y+h+(sr(seed,40+i)-.5)*5);
  for(let i=2;i>=1;i--)p.lineTo(x+(sr(seed,60+i)-.5)*6,y+h*i/3);
  p.closePath();return p;
}
function paperText(str,x,y,size,fill,align='center',stroke=INK){
  g.font=`${size}px ${FONT}`;g.textAlign=align;g.textBaseline='middle';g.lineJoin='round';
  const lw=Math.max(4,size*.17),dx=size*.06+2,dy=size*.08+2;
  g.lineWidth=lw;g.strokeStyle='#24093d';g.fillStyle='#24093d';g.strokeText(str,x+dx,y+dy);g.fillText(str,x+dx,y+dy);
  g.strokeStyle=stroke;g.strokeText(str,x,y);g.fillStyle=fill;g.fillText(str,x,y);
}

// ============================================================ anos 30: mangueira, luvas, olhos de torta
// braço de mangueira (rubber hose): curva grossa de nanquim, sem cotovelo
function hose(x0,y0,x1,y1,bend,w=7){
  const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy)||1,cx=(x0+x1)/2-dy/l*bend,cy=(y0+y1)/2+dx/l*bend;
  X.beginPath();X.moveTo(x0,y0);X.quadraticCurveTo(cx,cy,x1,y1);X.lineCap='round';X.lineWidth=w;X.strokeStyle=SHD?SHC:INK;X.stroke();
}
// luva branca de 3 dedos; dir = para onde os dedos apontam; open 0 = punho, 1 = mão aberta
function glove(x,y,dir,s,open,flip){
  X.save();X.translate(x,y);X.rotate(dir);X.scale(s,flip?-s:s);
  const o=clamp(open,0,1),L=5+o*8;
  for(let i=0;i<3;i++){const f=new Path2D();f.ellipse(8+L*.6,-7+i*7,L,4.6,(i-1)*.18*o,0,TAU);piece(f,GW,GS,2,3);}
  const pm=new Path2D();pm.ellipse(0,0,12,12.5,0,0,TAU);piece(pm,GW,GS,5,3.5);
  const th=new Path2D();th.ellipse(4,-12,4.5,7.5,.7,0,TAU);piece(th,GW,GS,3,3);
  const cf=new Path2D();cf.moveTo(-9,-11);cf.quadraticCurveTo(-21,-15,-21,0);cf.quadraticCurveTo(-21,15,-9,11);cf.closePath();piece(cf,GW,GS,6,3.5);
  if(!SHD){X.lineWidth=2;X.strokeStyle=INK;X.beginPath();for(const yy of [-5,0,5]){X.moveTo(-4,yy);X.lineTo(4,yy);}X.stroke();}
  X.restore();
}
// olhos ovais com pupila em "fatia de torta"
function pieEyes(x,y,sep,w,h,e,o){
  if(SHD)return;o=o||{};
  let dx=pl.x-e.x,dy=pl.y-e.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  const blink=(1-(o.squint||0)*.65)*(Math.sin(S.t*1.3+e.seed*7)>.985?.12:1);
  X.lineCap='round';X.lineJoin='round';
  for(const s of [-1,1]){
    const ex=x+s*sep,eh=Math.max(1.5,h*blink);
    if(o.ko){X.lineWidth=Math.max(3,w*.35);X.strokeStyle=INK;X.beginPath();X.moveTo(ex-w,y-w);X.lineTo(ex+w,y+w);X.moveTo(ex+w,y-w);X.lineTo(ex-w,y+w);X.stroke();continue;}
    const ey=new Path2D();ey.ellipse(ex,y,w,eh,0,0,TAU);
    X.fillStyle=o.red?'#ffe0e0':GW;X.fill(ey);
    if(eh>h*.35){
      X.save();X.clip(ey);
      const px=ex+dx*w*.35,py=y+dy*eh*.3+eh*.12;
      X.fillStyle=INK;X.beginPath();X.ellipse(px,py,w*.62,eh*.74,0,0,TAU);X.fill();
      X.fillStyle=o.red?'#ffe0e0':GW;X.beginPath();X.moveTo(px+w*.05,py-eh*.05);X.lineTo(px+w*.6,py-eh*.55);X.lineTo(px+w*.08,py-eh*.9);X.closePath();X.fill();
      X.restore();
    }
    X.lineWidth=Math.max(2.5,w*.4);X.strokeStyle=INK;X.stroke(ey);
    if(o.brow!=null){const b=o.brow,ix=ex-s*w*1.05,ox=ex+s*w*1.15;
      X.beginPath();X.moveTo(ix,y-h*1.15+b*h*.4);X.lineTo(ox,y-h*1.3-b*h*.15);X.lineWidth=Math.max(3,w*.55);X.stroke();}
  }
}
// sorrisão de dentes brancos com língua
function grin(x,y,w,open){
  if(SHD)return;
  const d=w*.25+open,p=new Path2D();
  p.moveTo(x-w,y-w*.15);p.quadraticCurveTo(x,y+w*.25,x+w,y-w*.15);
  p.quadraticCurveTo(x+w*.6,y+d*1.5+w*.2,x,y+d*1.3+w*.25);p.quadraticCurveTo(x-w*.6,y+d*1.5+w*.2,x-w,y-w*.15);p.closePath();
  X.fillStyle=INK;X.fill(p);
  X.save();X.clip(p);
  X.fillStyle='#ff6f91';X.beginPath();X.ellipse(x,y+d*1.3+w*.3,w*.5,d*.55+2,0,0,TAU);X.fill();
  X.fillStyle=GW;X.fillRect(x-w,y-w*.4,w*2,w*.42+Math.min(d*.3,w*.25));
  X.restore();
  X.lineJoin='round';X.lineWidth=Math.max(2,w*.12);X.strokeStyle=INK;X.stroke(p);
  X.lineWidth=Math.max(2,w*.1);X.beginPath();X.arc(x-w-1,y-w*.2,w*.2,Math.PI*.6,Math.PI*1.4);X.stroke();
  X.beginPath();X.arc(x+w+1,y-w*.2,w*.2,-Math.PI*.4,Math.PI*.4);X.stroke();
}
function oMouth(x,y,rx,ry){
  if(SHD)return;
  X.beginPath();X.ellipse(x,y,rx,ry,0,0,TAU);X.fillStyle=INK;X.fill();
  if(ry>4){X.save();X.clip();X.fillStyle='#ff6f91';X.beginPath();X.ellipse(x,y+ry*.8,rx*.7,ry*.5,0,0,TAU);X.fill();X.restore();}
}

// ============================================================ estado
const S={mode:'title',paused:false,t:0,rt:0,cam:0,speed:150,hue:0,score:0,best:0,lives:3,
  shake:0,ca:0,flash:0,hitstop:0,ts:1,dist:0,loop:0,segStart:0,nextBoss:900,waveT:2,boss:null,lastW:'',
  meter:0,wi:0,wpop:0,shotN:0,exq:[],sup:null,nextMode:1,banner:null,bq:[],intro:1,overT:0,wipe:null,prog:0,hpPop:0};
try{S.best=+localStorage.getItem('shooter.best')||0;}catch(e){}
const pl={x:330,y:H*.6,vx:0,vy:0,ax:0,rot:0,sq:0,sqv:0,by:0,inv:0,cool:0,recoil:0,trail:[],alive:true,parry:0,pcd:0,pspin:0,safe:0};
const notes=[],enemies=[],eb=[],parts=[];
const keys={}; let fireHeld=false, BT=0;
const firing=()=>keys.Space||keys.KeyZ||fireHeld;

// ============================================================ teoria musical
const BPM=150,SPB=60/BPM,STEP=SPB/3;   // grade de tercinas: dá o swing
const KEY=48;                          // dó
const MODES=[
  {n:'JÔNIO',mood:'BRILHANTE',iv:[0,2,4,5,7,9,11],col:C.yellow,w:44,wob:6},
  {n:'DÓRICO',mood:'JAZZÍSTICO',iv:[0,2,3,5,7,9,10],col:C.cyan,w:42,wob:14},
  {n:'FRÍGIO',mood:'MISTERIOSO',iv:[0,1,3,5,7,8,10],col:C.orange,w:40,wob:22},
  {n:'LÍDIO',mood:'SONHADOR',iv:[0,2,4,6,7,9,11],col:C.lime,w:62,wob:8},
  {n:'MIXOLÍDIO',mood:'MALANDRO',iv:[0,2,4,5,7,9,10],col:C.violet,w:46,wob:16},
  {n:'EÓLIO',mood:'MELANCÓLICO',iv:[0,2,3,5,7,8,10],col:C.sky,w:44,wob:10},
  {n:'LÓCRIO',mood:'SOMBRIO',iv:[0,1,3,5,6,8,10],col:C.red,w:54,wob:28},
];
const HM={mi:0,until:0};                       // modo em que a banda está tocando agora
const PROG=[0,5,1,4];                          // I · vi · ii · V, o turnaround do swing
const sc=d=>KEY+MODES[HM.mi].iv[wrap(d,7)]+12*Math.floor(d/7);
const chordOf=bar=>{const d=PROG[wrap(bar,4)];return [0,2,4,6].map(k=>sc(d+k));};   // tétrades empilhando terças dentro do modo
const WEAP=[
  {name:'ARPEJO',col:C.cyan,cols:[C.cyan,C.lime,'#5ff0f2',C.yellow],rate:.09},
  {name:'MAIOR',col:C.yellow,cols:[C.yellow,C.orange,'#fff3a6'],rate:.21},
  {name:'menor',col:C.violet,cols:['#b48cff',C.sky,C.violet],rate:.23},
];

function reset(){
  Object.assign(S,{score:0,lives:3,dist:0,loop:0,segStart:0,nextBoss:900,waveT:3.4,boss:null,lastW:'',meter:0,wpop:0,shotN:0,exq:[],sup:null,
    nextMode:1,banner:null,bq:[],intro:0,ts:1,overT:0,paused:false,prog:0,hpPop:0});
  HM.mi=0;HM.until=0;A.reharm();
  notes.length=enemies.length=eb.length=parts.length=0;
  Object.assign(pl,{x:-80,y:H/2,vx:0,vy:0,ax:0,rot:0,sq:0,sqv:0,inv:0,cool:0,recoil:0,trail:[],alive:true,parry:0,pcd:0,pspin:0,safe:1.6});
  banner('PRONTO?',PAPER,1.1);banner('VALENDO!',C.yellow,.9);
}
function transition(cb){S.wipe={ph:'in',t:0,cb};}
function banner(text,col,dur=1.6,sub){const b={text,col,t:0,dur,sub};if(S.banner)S.bq.push(b);else S.banner=b;}

// ============================================================ áudio: big band de bolso
const mtof=m=>440*Math.pow(2,(m-69)/12);
const A={ctx:null,muted:false,bar:0,ch:chordOf(0),start:0,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=this.ctx=new AC();
    this.out=c.createGain();this.out.gain.value=this.muted?0:.6;
    const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;this.out.connect(comp);comp.connect(c.destination);
    this.sfx=c.createGain();this.sfx.connect(this.out);
    this.mus=c.createGain();this.mus.gain.value=.55;this.mus.connect(this.out);
    this.echo=c.createGain();const dl=c.createDelay(1);dl.delayTime.value=SPB*.667;const fb=c.createGain();fb.gain.value=.3;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;const wet=c.createGain();wet.gain.value=.25;
    this.echo.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(this.out);
    const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;
    this.step=0;this.nt=c.currentTime+.08;this.start=this.nt;setInterval(()=>this.tick(),25);
  },
  mute(){this.muted=!this.muted;if(this.ctx)this.out.gain.setTargetAtTime(this.muted?0:.6,this.ctx.currentTime,.03);},
  reharm(){this.ch=chordOf(this.bar);},
  env(gn,t,a,peak,d){gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(peak,t+a);gn.gain.exponentialRampToValueAtTime(.0001,t+a+d);},
  osc(type,f,t,dur,peak,dest){const c=this.ctx,o=c.createOscillator(),gn=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    this.env(gn,t,.005,peak,dur);o.connect(gn);gn.connect(dest||this.sfx);o.start(t);o.stop(t+dur+.06);return o;},
  noise(t,dur,peak,type,freq,q,dest){const c=this.ctx,s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type=type;
    f.frequency.setValueAtTime(freq,t);if(q)f.Q.value=q;const gn=c.createGain();this.env(gn,t,.002,peak,dur);
    s.connect(f);f.connect(gn);gn.connect(dest||this.sfx);s.start(t,Math.random()*.5);s.stop(t+dur+.06);return f;},
  tick(){const c=this.ctx;if(!c)return;while(this.nt<c.currentTime+.12){this.play(this.step,this.nt);this.nt+=STEP;this.step++;}},
  play(s,t){
    const st=s%12,bar=Math.floor(s/12)%4;
    if(st===0){this.bar=bar;this.ch=chordOf(bar);}
    const ch=this.ch,on=S.mode==='play'&&!S.paused;
    if(on&&[0,3,5,6,9,11].includes(st))this.noise(t,.22,st===5||st===11?.045:.08,'bandpass',8200,.9,this.mus);   // prato de condução: tchin, tchi-ki-tchin
    if(on&&(st===3||st===9)){this.noise(t,.18,.12,'bandpass',2200,.6,this.mus);this.noise(t,.03,.09,'highpass',7000,0,this.mus);} // vassourinha + chimbal
    if(st%6===0)this.kick(t,on?(S.boss?.6:.45):.2);
    if(st%3===0){   // baixo acústico caminhando: fundamental, terça, quinta, aproximação cromática
      const b=st/3,nx=chordOf(bar+1)[0];
      this.bass([ch[0],ch[1],ch[2],nx+(bar%2?1:-1)][b]-12,t,on?.3:.18);
    }
    if(st===0||st===5)this.piano([ch[1],ch[2],ch[3]].map(x=>x+12),t,on?.045:.035);   // piano no ritmo charleston
  },
  kick(t,v){const c=this.ctx,o=c.createOscillator(),gn=c.createGain();o.type='sine';o.frequency.setValueAtTime(130,t);
    o.frequency.exponentialRampToValueAtTime(45,t+.1);this.env(gn,t,.003,v,.22);o.connect(gn);gn.connect(this.mus);o.start(t);o.stop(t+.3);},
  bass(m,t,v){const c=this.ctx,f=mtof(m),o=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter(),gn=c.createGain();
    o.type='triangle';o.frequency.setValueAtTime(f*1.02,t);o.frequency.exponentialRampToValueAtTime(f,t+.03);o2.type='sine';o2.frequency.value=f;
    lp.type='lowpass';lp.frequency.setValueAtTime(900,t);lp.frequency.exponentialRampToValueAtTime(280,t+.25);
    this.env(gn,t,.006,v,.34);o.connect(lp);o2.connect(lp);lp.connect(gn);gn.connect(this.mus);o.start(t);o2.start(t);o.stop(t+.45);o2.stop(t+.45);},
  piano(ms,t,v){const c=this.ctx;for(const m of ms){const f=mtof(m),o=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter(),gn=c.createGain(),g2=c.createGain();
    o.type='triangle';o.frequency.value=f;o2.type='square';o2.frequency.value=f*1.003;g2.gain.value=.3;
    lp.type='lowpass';lp.frequency.setValueAtTime(2600,t);lp.frequency.exponentialRampToValueAtTime(700,t+.3);
    o2.connect(g2);g2.connect(lp);o.connect(lp);lp.connect(gn);this.env(gn,t,.004,v,.42);gn.connect(this.mus);o.start(t);o2.start(t);o.stop(t+.5);o2.stop(t+.5);}},
  // timbres dos tiros: vibrafone (arpejo), metais com surdina (maior), clarinete (menor)
  voice(kind,m,t,v){
    const c=this.ctx,f=mtof(m),gn=c.createGain();gn.connect(this.sfx);gn.connect(this.echo);
    if(kind==='vib'){
      this.env(gn,t,.004,v,.38);const o=c.createOscillator();o.type='sine';o.frequency.value=f;o.connect(gn);o.start(t);o.stop(t+.45);
      const o2=c.createOscillator(),g2=c.createGain();o2.type='sine';o2.frequency.value=f*4;this.env(g2,t,.002,.35,.08);o2.connect(g2);g2.connect(gn);o2.start(t);o2.stop(t+.15);
    }else if(kind==='brass'){
      this.env(gn,t,.012,v,.26);const o=c.createOscillator(),lp=c.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(f*.985,t);o.frequency.exponentialRampToValueAtTime(f,t+.04);
      lp.type='lowpass';lp.Q.value=4;lp.frequency.setValueAtTime(500,t);lp.frequency.exponentialRampToValueAtTime(3200,t+.04);lp.frequency.exponentialRampToValueAtTime(900,t+.25);
      o.connect(lp);lp.connect(gn);o.start(t);o.stop(t+.32);
    }else{
      this.env(gn,t,.02,v,.3);const o=c.createOscillator(),lp=c.createBiquadFilter();o.type='square';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=1500;
      o.connect(lp);lp.connect(gn);o.start(t);o.stop(t+.36);
    }
  },
  shot(wi,n){
    if(!this.ctx)return;const t=this.ctx.currentTime,ch=this.ch;
    if(wi===0){   // arpejador: sobe e desce pelas notas do acorde da vez
      const tones=[...ch.map(x=>x+12),...ch.map(x=>x+24)],L=tones.length,per=(L-1)*2;let i=n%per;if(i>=L)i=per-i;
      this.voice('vib',tones[i],t,.11);
    }else{        // tríade maior ou menor sobre a fundamental, alternando inversões, dedilhada
      const r=ch[0]+12,q=wi===1?[0,4,7]:[0,3,7],inv=n%3;
      q.forEach((iv,i)=>this.voice(wi===1?'brass':'clar',r+iv+(i<inv?12:0),t+i*.014,wi===1?.05:.06));
    }
  },
  scale(){if(!this.ctx)return;const t=this.ctx.currentTime;for(let i=0;i<8;i++)this.voice('vib',sc(i)+24,t+i*.055,.13);},
  modeShift(){   // glissando pelo modo novo + acorde sustentado
    if(!this.ctx)return;const c=this.ctx,t=c.currentTime;this.reharm();
    for(let i=0;i<15;i++)this.voice('brass',sc(i)+12,t+i*.04,.07);
    for(const k of [0,2,4]){const o=c.createOscillator(),lp=c.createBiquadFilter(),gn=c.createGain();o.type='sawtooth';o.frequency.value=mtof(sc(k)+12);
      lp.type='lowpass';lp.frequency.value=1400;gn.gain.setValueAtTime(.0001,t+.55);gn.gain.exponentialRampToValueAtTime(.05,t+.8);gn.gain.exponentialRampToValueAtTime(.0001,t+3);
      o.connect(lp);lp.connect(gn);gn.connect(this.sfx);gn.connect(this.echo);o.start(t+.55);o.stop(t+3.1);}
  },
  parry(){if(!this.ctx)return;const t=this.ctx.currentTime;this.osc('sine',1568,t,.35,.18);this.osc('sine',2349,t+.04,.4,.12,this.echo);this.osc('triangle',3136,t+.08,.25,.05);},
  tock(down){if(!this.ctx)return;const t=this.ctx.currentTime;this.osc('sine',down?1900:1400,t,.035,.07);this.noise(t,.025,.05,'bandpass',2400,4);},
  honk(){if(!this.ctx)return;const c=this.ctx,t=c.currentTime,o=c.createOscillator(),lp=c.createBiquadFilter(),gn=c.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(150,t+.4);lp.type='lowpass';lp.Q.value=6;
    lp.frequency.setValueAtTime(400,t);lp.frequency.exponentialRampToValueAtTime(2400,t+.08);lp.frequency.exponentialRampToValueAtTime(500,t+.4);
    this.env(gn,t,.02,.14,.4);o.connect(lp);lp.connect(gn);gn.connect(this.sfx);o.start(t);o.stop(t+.5);},
  inhale(){if(!this.ctx)return;const t=this.ctx.currentTime,f=this.noise(t,.7,.06,'bandpass',500,2);f.frequency.exponentialRampToValueAtTime(2200,t+.7);},
  whoosh(){if(!this.ctx)return;const t=this.ctx.currentTime,f=this.noise(t,.3,.18,'bandpass',500,2);f.frequency.exponentialRampToValueAtTime(3000,t+.3);},
  windup(){if(!this.ctx)return;const t=this.ctx.currentTime,o=this.osc('square',180,t,.6,.04);o.frequency.exponentialRampToValueAtTime(520,t+.6);},
  clap(){if(!this.ctx)return;const t=this.ctx.currentTime;for(let i=0;i<3;i++)this.noise(t+i*.012,.12,.4,'bandpass',1400,1.2);},
  groan(){if(!this.ctx)return;const t=this.ctx.currentTime,o=this.osc('sawtooth',170,t,.8,.16);o.frequency.exponentialRampToValueAtTime(55,t+.8);},
  swap(){if(!this.ctx)return;const t=this.ctx.currentTime;this.osc('square',880,t,.03,.04);this.osc('square',1320,t+.04,.03,.04);},
  nope(){if(!this.ctx)return;const t=this.ctx.currentTime;this.osc('square',200,t,.08,.04);},
  hit(){if(!this.ctx)return;const t=this.ctx.currentTime;this.noise(t,.05,.13,'bandpass',2600+Math.random()*1500,1.5);},
  boom(big){if(!this.ctx)return;const t=this.ctx.currentTime;const f=this.noise(t,big?.9:.4,big?.7:.45,'lowpass',big?1400:2200,1);
    f.frequency.exponentialRampToValueAtTime(140,t+(big?.9:.4));const o=this.osc('sine',120,t,big?.6:.3,big?.8:.5);o.frequency.exponentialRampToValueAtTime(34,t+(big?.6:.3));},
  hurt(){if(!this.ctx)return;const t=this.ctx.currentTime;const o=this.osc('sawtooth',520,t,.5,.22);o.frequency.exponentialRampToValueAtTime(80,t+.5);this.noise(t,.3,.3,'lowpass',900,1);},
  eshot(){if(!this.ctx)return;const t=this.ctx.currentTime;const o=this.osc('square',340,t,.1,.05);o.frequency.exponentialRampToValueAtTime(150,t+.1);},
  fanfare(){if(!this.ctx)return;const t=this.ctx.currentTime;[0,4,7,12,16,19,24].forEach((s,i)=>this.voice('brass',60+s,t+i*.07,.1));},
  alarm(){if(!this.ctx)return;const t=this.ctx.currentTime;for(let i=0;i<4;i++)this.osc('square',i%2?330:440,t+i*.28,.2,.07);},
};

// ============================================================ inimigos
const UPD={},DRAW={},ESC=1.4,BSC=1.3;   // inimigos maiores e legíveis, como personagens de desenho
function mkEnemy(type,o){
  const e=Object.assign({type,x:W+80,y:H/2,r:26,hp:1,t:0,rot:0,sq:0,sqv:0,kx:0,flash:0,delay:0,bob:0,bo:0,seed:Math.random()*100,score:100},o);
  e.maxhp=e.hp;enemies.push(e);return e;
}
function fireAt(x,y,a,sp,pink,kind){eb.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,r:kind==='rock'?11:9,pink:!!pink,kind:kind||'drop'});}

// --- Colcheias Gêmeas: duas notas de mãos dadas (o "colchete"); se uma cai, a outra vira bandeirola e parte pra cima
function twins(o){
  const pal=pick([[PP.lime,PP.yellow],[PP.cyan,PP.violet],[PP.orange,PP.lemon],[PP.sky,PP.lime]]),amp=o.amp!=null?o.amp:rand(40,80),spd=150+S.loop*15;
  const mk=(side,p)=>mkEnemy('twin',{x0:(o.x0!=null?o.x0:W+90)+side*26*ESC,y0:o.y0,amp,spd,side,r:22*ESC,hp:3,score:150,pal:p,bo:side>0?.5:0,state:'dance',delay:o.delay||0});
  const a=mk(-1,pal[0]),b=mk(1,pal[1]);a.mate=b;b.mate=a;
}
UPD.twin=(e,dt)=>{
  if(e.state==='dance'){
    e.x=e.x0-e.spd*e.t;e.y=e.y0+e.amp*Math.sin(e.t*1.8)-e.bob*16;e.rot=Math.sin(BT*Math.PI)*.15*e.side;
    if(e.mate&&e.mate.dead){if(e.mate.killed){e.state='mad';e.t=0;e.sqv+=8;}e.mate=null;}
    if(e.x<-90)e.dead=true;
  }else{
    if(e.t<.65){e.kx=(Math.random()-.5)*9;e.ang=Math.atan2(pl.y-e.y,pl.x-e.x);}
    else{
      if(!e.dash){e.dash=1;e.vx=Math.cos(e.ang)*560;e.vy=Math.sin(e.ang)*560;A.whoosh();}
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.rot+=dt*9;
      if(e.x<-90||e.x>W+90||e.y<-90||e.y>H+90)e.dead=true;
    }
  }
};
DRAW.twin=e=>{
  const sx=17,sy=-46,mad=e.state==='mad';
  X.save();X.translate(e.x+e.kx,e.y);X.scale(ESC,ESC);
  const m=e.mate;
  if(m&&!m.dead&&!mad&&m.delay<=0){
    const cx=((m.x+m.kx)-(e.x+e.kx))/2/ESC+sx,cy=(m.y-e.y)/2/ESC+sy+4;
    hose(sx,sy+8,cx-e.side*5,cy,-10*e.side,6);
    glove(cx-e.side*5,cy,e.side<0?0:Math.PI,.5,.25,e.side>0);
  }else{
    const f=new Path2D();f.moveTo(sx,sy);f.bezierCurveTo(sx+18,sy+6,sx+22,sy+18,sx+12,sy+30);f.bezierCurveTo(sx+14,sy+18,sx+8,sy+12,sx,sy+13);f.closePath();
    piece(f,INK,null,0,3);
  }
  X.lineCap='round';X.beginPath();X.moveTo(sx,-4);X.lineTo(sx,sy);X.lineWidth=7;X.strokeStyle=SHD?SHC:INK;X.stroke();
  X.rotate(e.rot);X.scale(1+e.sq,1-e.sq);
  const hd=new Path2D();hd.ellipse(0,0,21,16,-.35,0,TAU);piece(hd,e.pal[0],e.pal[1],5,4,.35);
  pieEyes(-3,-4,7,5.5,7.5,e,{brow:mad?1.3:-.25});
  if(mad)grin(-3,7,8,1);else oMouth(-3,8,2.5+e.bob*2.5,1.5+e.bob*4.5);
  X.restore();
};

// --- Tic-Tac, o metrônomo voador: o pêndulo marca o tempo; congela no 3º tempo e atira no 1º
function metro(o){return mkEnemy('metro',{r:32*ESC,hp:10,score:250,state:'enter',hx:o.hx,hy:o.hy,delay:o.delay||0,pa:0,antic:false,shots:0,lb:Math.floor(BT),
  pal:pick([PP.wood,PP.violet,PP.cyan,PP.lime]),x:W+90,y:o.hy});}
UPD.metro=(e,dt)=>{
  const bt=Math.floor(BT);
  e.pa=e.antic?damp(e.pa,.95,14,dt):Math.cos(BT*Math.PI)*.6;
  if(e.state==='enter'){
    const k=Math.min(1,e.t/1.2);e.x=lerp(W+90,e.hx,E.outBack(k));e.y=e.hy-Math.sin(k*Math.PI)*50;
    if(k>=1){e.state='hover';e.t=0;e.lb=bt;}
  }else if(e.state==='hover'){
    e.x=e.hx+Math.sin(e.t*.9)*14;e.y=e.hy-e.bob*10;e.rot=Math.sin(BT*Math.PI)*.06;
    if(bt!==e.lb){
      e.lb=bt;const b4=wrap(bt,4);A.tock(b4===0);
      if(e.shots>=3){if(b4===1){e.state='leave';e.t=0;e.lx=e.x;e.ly=e.y;}}
      else if(b4===2){e.antic=true;e.sqv+=4;}
      else if(b4===0&&e.antic){
        e.antic=false;e.shots++;const mx=e.x-30*ESC,my=e.y-6*ESC,base=Math.atan2(pl.y-my,pl.x-mx);
        for(let k=-1;k<=1;k++)fireAt(mx,my,base+k*.2,270+S.loop*30,k===0&&e.shots%2===1,'drop');
        e.kx+=12;e.sqv-=9;A.eshot();sparks(mx,my,C.orange,4,200);
      }
    }
  }else{
    const u=Math.min(1,e.t/1.4);e.x=lerp(e.lx,e.lx-120,u);e.y=lerp(e.ly,-140,E.inCubic(u));if(u>=1)e.dead=true;
  }
};
DRAW.metro=e=>{
  const fl=Math.sin(S.t*16+e.seed)*.5+.5,P=e.pal,bob=e.bob;
  X.save();X.translate(e.x+e.kx,e.y);X.scale(ESC,ESC);X.rotate(e.rot);X.scale(1+e.sq,1-e.sq);
  for(const s of [-1,1]){const w=new Path2D();w.moveTo(s*8,-28);w.lineTo(s*(30+8*fl),-50-10*fl);w.lineTo(s*22,-20);w.closePath();piece(w,PAPER,'#e3cfa8',-34,3);}
  X.save();X.translate(0,24);X.rotate(e.pa*.8);
  X.beginPath();X.moveTo(0,0);X.lineTo(0,34);X.lineWidth=5;X.strokeStyle=SHD?SHC:INK;X.stroke();
  const wt=new Path2D();wt.moveTo(-8,22);wt.lineTo(8,22);wt.lineTo(10,34);wt.lineTo(-10,34);wt.closePath();piece(wt,PP.yellow[0],PP.yellow[1],28,3);
  X.restore();
  const lh=e.antic?[-46,-16]:[-40,8-bob*12],rh=[40,8-bob*12];
  hose(-18,-4,lh[0],lh[1],10,6);hose(18,-4,rh[0],rh[1],-10,6);

  for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(140,520)*power;
    const col=pick(cols);parts.push({k:'conf',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-240*power,g:1100,rot:rand(0,TAU),vr:rand(-12,12),
      fl:rand(0,TAU),vf:rand(6,16),s:rand(5,11)*Math.sqrt(power),col,tri:Math.random()<.5,life:rand(.9,1.6),max:1.6,scroll:1});}
}
function miniNotes(x,y,n){for(let i=0;i<n;i++)parts.push({k:'mnote',x,y,vx:rand(-120,120),vy:rand(-320,-160),g:520,rot:rand(-.4,.4),col:pick(NEON),life:rand(.7,1.1),max:1.1,scroll:1});}

// ============================================================ jogador
function addNote(o){
  const n=Object.assign({age:0,rot:0,glyph:(Math.random()*3)|0,st:0,size:1,dmg:1,wob:0,home:0,ex:false},o);
  n.vx=Math.cos(o.ang||0)*o.sp;n.vy=Math.sin(o.ang||0)*o.sp;n.by=n.y;n.px=n.x;n.py=n.y;notes.push(n);
}
function shoot(){
  const n=S.shotN++,w=WEAP[S.wi],gx=pl.x+44,gy=pl.y+pl.by;
  if(S.wi===0){        // arpejo: rajada rápida que sobe e desce como as notas do acorde
    addNote({x:gx,y:gy+[-12,-4,4,12,4,-4][n%6],sp:900,col:w.cols[n%w.cols.length],wob:7*(n%2?1:-1)});
  }else if(S.wi===1){  // acorde maior: leque aberto e brilhante
    for(let i=-1;i<=1;i++)addNote({x:gx,y:gy,ang:i*.2,sp:780,col:w.cols[i+1],glyph:1});
  }else{               // acorde menor: três notas que perseguem o alvo
    for(let i=-1;i<=1;i++)addNote({x:gx-4,y:gy+i*10,ang:i*.35,sp:620,col:w.cols[i+1],dmg:.8,home:1,glyph:2});
  }
  pl.sqv-=4;pl.recoil=6;ring(gx+4,gy,w.col,4,22,.2);
  if(S.mode==='play')A.shot(S.wi,n);
}
function special(){
  if(S.mode!=='play'||S.intro<1||S.sup||!pl.alive)return;
  if(S.meter>=5){superMode();return;}
  if(S.meter<1||S.exq.length){A.nope();return;}
  S.meter-=1;for(let i=0;i<8;i++)S.exq.push({t:i*.055,i});   // ESCALA: oito notas grandes subindo como uma escada
  pl.recoil=14;pl.sqv-=10;S.shake=Math.max(S.shake,5);A.scale();
}
function superMode(){
  S.meter=0;const mi=S.nextMode;S.nextMode=(S.nextMode+1)%7;
  S.sup={t:0,dur:2.8,mi,ft:0};HM.mi=mi;HM.until=S.rt+14;A.modeShift();
  const M=MODES[mi];banner('MODO '+M.n,M.col,1.9,M.mood);
  S.flash=.3;S.shake=16;S.hitstop=.12;
}
function parry(){
  if(S.mode!=='play'||S.intro<1||pl.pcd>0||!pl.alive)return;
  pl.parry=.22;pl.pcd=.45;
}
function parryOK(x,y){
  S.meter=Math.min(5,S.meter+1);S.hitstop=.16;pl.pspin=1;pl.parry=0;pl.pcd=0;pl.safe=Math.max(pl.safe,.3);
  ring(x,y,C.pink,8,90,.4);sparks(x,y,C.pink,10,320);A.parry();
}
function swap(){if(S.mode!=='play')return;S.wi=(S.wi+1)%3;S.wpop=1;pl.cool=Math.min(pl.cool,.05);A.swap();}
function updatePlayer(dt){
  if(S.intro<1){
    S.intro=Math.min(1,S.intro+dt/.9);const u=E.outBack(S.intro),px=pl.x,py=pl.y;
    pl.x=lerp(-80,230,u);pl.y=H/2-Math.sin(S.intro*Math.PI)*70;
    pl.vx=(pl.x-px)/Math.max(dt,1e-4);pl.vy=(pl.y-py)/Math.max(dt,1e-4);
  }else{
    let ix=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),iy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
    if(ix&&iy){ix*=.7071;iy*=.7071;}
    const pvx=pl.vx;
    pl.vx=damp(pl.vx,ix*MAXV,9,dt);pl.vy=damp(pl.vy,iy*MAXV,9,dt);
    pl.ax=(pl.vx-pvx)/Math.max(dt,1e-4);
    pl.x+=pl.vx*dt;pl.y+=pl.vy*dt;
    if(pl.x<50){pl.x=50;pl.vx=Math.max(0,pl.vx);}
    if(pl.x>W*.72){pl.x=W*.72;pl.vx=Math.min(0,pl.vx);}
    if(pl.y<50){pl.y=50;pl.vy=Math.max(0,pl.vy);}
    if(pl.y>H-70){pl.y=H-70;pl.vy=Math.min(0,pl.vy);}
  }
  pl.cool-=dt;
  if(firing()&&pl.cool<=0&&S.intro>=1&&!S.sup){pl.cool=WEAP[S.wi].rate;shoot();}
  for(let i=S.exq.length-1;i>=0;i--){
    const q=S.exq[i];q.t-=dt;if(q.t>0)continue;S.exq.splice(i,1);
    const gx=pl.x+44,gy=pl.y+pl.by;
    addNote({x:gx,y:gy+22-q.i*7,ang:-.06,sp:720,col:[C.yellow,C.orange,C.lime,C.cyan,C.sky,C.violet,C.yellow,C.orange][q.i],dmg:3,size:1.55,ex:true,glyph:q.i%3});
    ring(gx,gy,C.yellow,4,30,.2);
  }
  pl.inv-=dt;pl.safe-=dt;pl.parry-=dt;pl.pcd-=dt;
}
function updatePlayerAnim(dt){
  pl.by=Math.sin(S.t*3.2)*4;
  pl.rot=damp(pl.rot,clamp(pl.vy*.0011,-.5,.5),7,dt);           // follow-through na inclinação
  pl.sqv+=(-170*pl.sq-11*pl.sqv)*dt;pl.sq+=pl.sqv*dt;            // mola de squash & stretch
  pl.recoil=damp(pl.recoil,0,14,dt);pl.pspin=Math.max(0,pl.pspin-dt*2.4);
  for(const p of pl.trail)p.x-=S.speed*dt*.9;
  const c=Math.cos(pl.rot),s=Math.sin(pl.rot);
  pl.trail.push({x:pl.x-pl.recoil+(-30*c-4*s),y:pl.y+pl.by+(-30*s+4*c)});
  while(pl.trail.length>26)pl.trail.shift();
}
function hurt(){
  if(pl.inv>0||pl.safe>0||S.sup||!pl.alive||S.mode!=='play')return;
  S.lives--;pl.inv=2.2;S.shake=22;S.ca+=3;S.hitstop=.12;S.flash=.35;pl.sqv+=12;S.hpPop=1;
  confetti(pl.x,pl.y,[PAPER,'#d7c8ff',C.pink],12,.8);ring(pl.x,pl.y,C.red,10,90,.4);A.hurt();
  if(S.lives<=0)gameOver();
}
function gameOver(){
  S.mode='over';S.overT=0;S.ts=.3;pl.alive=false;S.sup=null;
  const b=S.boss;S.prog=b?.5+.5*(1-Math.max(0,b.hp)/b.maxhp):.5*clamp((S.dist-S.segStart)/(S.nextBoss-S.segStart),0,1);
  confetti(pl.x,pl.y,[PAPER,'#d7c8ff','#a58cf0',C.pink,C.yellow],30,1.3);ring(pl.x,pl.y,C.pink,10,220,.8);ring(pl.x,pl.y,C.cyan,10,150,.6);
  S.shake=30;S.ca+=4;A.boom(true);
  if(S.score>S.best){S.best=S.score;try{localStorage.setItem('shooter.best',S.best);}catch(e){}}
}

// ============================================================ update
function hitEnemy(e,x,y,col,dmg,charge){
  const big=e.type==='boss';e.hp-=dmg;
  if(charge)S.meter=Math.min(5,S.meter+.022*dmg);
  e.flash=.06;e.sqv+=big?1.5:6;e.kx+=big?2:8;
  puff(x,y,8,1);sparks(x,y,col,2,200);S.ca+=.15;A.hit();
  if(e.hp<=0)kill(e);
}
function kill(e){
  if(e.dead)return;
  if(e.type==='boss'){
    if(!e.dying){e.dying=.001;e.hp=0;e.at=null;S.ts=.35;A.boom(true);banner('NOCAUTE!',C.yellow,2.4);
      for(const b of eb)confetti(b.x,b.y,[PAPER,C.yellow],2,.5);eb.length=0;}
    return;
  }
  e.dead=e.killed=true;S.score+=e.score;
  const cols=e.pal?[e.pal[0],e.pal[1],PAPER]:[C.yellow,C.orange,PAPER];
  confetti(e.x,e.y,cols,10,1);ring(e.x,e.y,pick(NEON),8,e.r*2.4);puff(e.x,e.y,16,3);miniNotes(e.x,e.y,2);
  S.shake=Math.max(S.shake,8);S.hitstop=.045;S.ca+=1.1;S.flash+=.04;A.boom(false);
}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.delay>0){e.delay-=dt;continue;}
    e.t+=dt;e.flash-=dt;e.kx=damp(e.kx,0,12,dt);
    e.sqv+=(-120*e.sq-10*e.sqv)*dt;e.sq=clamp(e.sq+e.sqv*dt,-.3,.3);
    e.bob=Math.abs(Math.sin((BT+e.bo)*Math.PI));   // todo mundo dança no tempo da música
    UPD[e.type](e,dt);
  }
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead)enemies.splice(i,1);
}
function updateNotes(dt){
  for(let i=notes.length-1;i>=0;i--){
    const n=notes[i];n.age+=dt;
    if(n.home){
      let best=null,bd=1e9;
      for(const e of enemies){if(e.delay>0||e.dead||e.dying||e.x<n.x-40||e.x>W+20)continue;const d=(e.x-n.x)**2+(e.y-n.y)**2;if(d<bd){bd=d;best=e;}}
      if(best){const a=Math.atan2(n.vy,n.vx),da=normA(Math.atan2(best.y-n.y,best.x-n.x)-a),na=a+clamp(da,-6*dt,6*dt),sp=Math.hypot(n.vx,n.vy);n.vx=Math.cos(na)*sp;n.vy=Math.sin(na)*sp;}
    }
    n.x+=n.vx*dt;n.by+=n.vy*dt;
    n.y=n.by+n.wob*Math.sin(n.age*12)*E.outCubic(Math.min(1,n.age*3.5));
    n.rot=Math.atan2(n.y-n.py,n.x-n.px)*.7+Math.sin(n.age*14)*.12;n.px=n.x;n.py=n.y;
    n.st-=dt;if(n.st<=0){n.st=.07;parts.push({k:'spark',x:n.x-10,y:n.y,vx:-60,vy:rand(-30,30),col:n.col,life:.22,max:.5,g:0,s:3.5});}
    if(n.x>W+60||n.x<-60||n.y<-60||n.y>H+60)notes.splice(i,1);
  }
}
function updateEB(dt){
  for(let i=eb.length-1;i>=0;i--){const b=eb[i];b.t+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40)eb.splice(i,1);}
}
function updateSuper(dt){
  const s=S.sup;if(!s)return;s.t+=dt;
  const M=MODES[s.mi],bx=pl.x+40,by=pl.y+pl.by,hw=M.w;
  s.ft-=dt;const fx=s.ft<=0;if(fx)s.ft=.08;
  if(s.t>.15)for(const e of enemies){
    if(e.delay>0||e.dead||e.dying)continue;
    if(e.x+e.r>bx&&Math.abs(e.y-by)<hw+e.r*.8){e.hp-=26*dt;if(fx){e.flash=.05;e.kx+=4;sparks(e.x-e.r*.5,by,M.col,2,240);A.hit();}if(e.hp<=0)kill(e);}
  }
  for(let i=eb.length-1;i>=0;i--){const b=eb[i];if(b.x>bx&&Math.abs(b.y-by)<hw+8){sparks(b.x,b.y,M.col,2,160);eb.splice(i,1);}}
  pl.recoil=4+Math.random()*3;S.shake=Math.max(S.shake,2);
  if(s.t>=s.dur)S.sup=null;
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.scroll)p.x-=S.speed*dt*.6;
    if(p.k==='conf'){p.vx*=Math.exp(-1.4*dt);p.vy=Math.min(p.vy,260);p.rot+=p.vr*dt;p.fl+=p.vf*dt;}
    if(p.k==='mnote')p.vx*=Math.exp(-1.5*dt);
  }
  if(parts.length>500)parts.splice(0,parts.length-500);
}
function collide(){
  for(let i=notes.length-1;i>=0;i--){
    const n=notes[i];
    for(const e of enemies){
      if(e.delay>0||e.dead||e.dying)continue;
      const rr=e.r+10*n.size;if((n.x-e.x)**2+(n.y-e.y)**2<rr*rr){hitEnemy(e,n.x,n.y,n.col,n.dmg,!n.ex);notes.splice(i,1);break;}
    }
  }
  if(S.mode!=='play'||!pl.alive)return;
  for(const e of enemies){
    if(e.delay>0||e.dead||e.dying)continue;
    const rr=e.r*.78+14;
    if((pl.x-e.x)**2+(pl.y-e.y)**2<rr*rr&&pl.inv<=0&&pl.safe<=0&&!S.sup){hurt();if(e.type!=='boss')hitEnemy(e,e.x,e.y,C.red,2,false);}
    if(e.type==='boss')for(const h of e.hands){const hr=h.r*h.s*.9+12;if(h.hot&&(pl.x-h.x)**2+(pl.y-h.y)**2<hr*hr)hurt();}
  }
  for(let i=eb.length-1;i>=0;i--){
    const b=eb[i],d2=(pl.x-b.x)**2+(pl.y-b.y)**2;
    if(b.pink&&pl.parry>0&&d2<(b.r+36)**2){eb.splice(i,1);parryOK(b.x,b.y);continue;}
    if(d2<(b.r+11)**2&&pl.inv<=0&&pl.safe<=0&&!S.sup){eb.splice(i,1);hurt();}
  }
}
function spawner(dt){
  if(S.boss)return;
  if(S.dist>=S.nextBoss){if(!enemies.length)spawnBoss();return;}
  S.waveT-=dt;
  if(S.waveT<=0&&enemies.length<=1){spawnWave();S.waveT=rand(3.2,4.4)-Math.min(1,S.loop*.3);}
}
function updateWipe(dt){
  const w=S.wipe;if(!w)return;w.t+=dt;
  if(w.ph==='in'&&w.t>=.5){w.cb();w.ph='out';w.t=0;}
  else if(w.ph==='out'&&w.t>=.8)S.wipe=null;
}
function update(rdt){
  S.rt+=rdt;updateWipe(rdt);BOIL=Math.floor(S.rt*12);
  BT=A.ctx&&A.start?(A.ctx.currentTime-A.start)/SPB:S.rt/SPB;
  if(S.banner){S.banner.t+=rdt;if(S.banner.t>S.banner.dur)S.banner=S.bq.shift()||null;}
  S.wpop=damp(S.wpop,0,7,rdt);S.hpPop=damp(S.hpPop,0,5,rdt);
  if(HM.mi&&S.rt>HM.until){HM.mi=0;A.reharm();}
  if(S.paused)return;
  let dt=rdt*S.ts;S.ts=damp(S.ts,1,2.2,rdt);
  if(S.hitstop>0){S.hitstop-=rdt;dt*=.05;}
  S.t+=dt;
  S.shake*=Math.exp(-rdt*9);S.ca=damp(Math.min(S.ca,6),0,3.5,rdt);S.flash=damp(S.flash,0,9,rdt);
  // quanto mais à frente o avião, mais rápido o mundo rola e revela a lateral
  const target=S.mode==='play'?130+300*clamp((pl.x-60)/(W*.72-60),0,1):150;
  S.speed=damp(S.speed,target,2.5,dt);S.cam+=S.speed*dt;S.hue=S.t*4+S.cam*.006;
  if(S.mode==='title'){
    const px=pl.x,py=pl.y;pl.x=330+170*Math.sin(S.t*.7);pl.y=H*.62+90*Math.sin(S.t*1.4);
    pl.vx=(pl.x-px)/Math.max(dt,1e-4);pl.vy=(pl.y-py)/Math.max(dt,1e-4);
    pl.cool-=dt;if(pl.cool<=0){pl.cool=.42;shoot();}
  }else if(S.mode==='play'){
    S.dist+=S.speed*dt/10;
    updatePlayer(dt);spawner(dt);updateSuper(dt);
  }else S.overT+=rdt;
  updatePlayerAnim(dt);
  updateEnemies(dt);updateNotes(dt);updateEB(dt);collide();updateParts(dt);
}

// ============================================================ cenário
const HILLS=[
  {p:.32,base:H-150,a:[60,.0031,25,.0083,12,.019],h:250,l:42},
  {p:.55,base:H-92,a:[50,.0042,22,.011,10,.023],h:315,l:55},
  {p:.85,base:H-42,a:[40,.0052,18,.013,8,.027],h:175,l:50},
];
const FG={p:1.35,base:H+14,a:[34,.006,14,.017,6,.031],h:45,l:58};
function hillY(L,x){const wx=x+S.cam*L.p+L.p*1000,a=L.a;return L.base-(a[0]*Math.sin(wx*a[1])+a[2]*Math.sin(wx*a[3]+1.7)+a[4]*Math.sin(wx*a[5]+4.1));}
function drawHill(L){
  const p=new Path2D(),edge=new Path2D();p.moveTo(-40,H+80);
  for(let x=-40;x<=W+40;x+=16){const y=hillY(L,x);p.lineTo(x,y);x===-40?edge.moveTo(x,y):edge.lineTo(x,y);}
  p.lineTo(W+40,H+80);p.closePath();
  const hue=L.h+S.hue;
  g.save();g.translate(SHX*.8,SHY*.8);g.fillStyle='rgba(26,6,48,.45)';g.fill(p);g.restore();
  g.fillStyle=`hsl(${hue},85%,${L.l}%)`;g.fill(p);
  g.save();g.clip(p);
  g.save();g.translate(26,28);g.fillStyle=`hsl(${hue+10},80%,${L.l-14}%)`;g.fill(p);g.restore();     // sombra dura
  g.translate(0,13);g.setLineDash([12,10]);g.lineDashOffset=S.cam*L.p;g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=3;g.stroke(edge); // costura
  g.restore();
  g.lineWidth=5;g.strokeStyle=INK;g.stroke(p);
}
function drawLollipops(L){
  const SEG=300,off=S.cam*L.p,i0=Math.floor((off-100)/SEG),i1=Math.floor((off+W+100)/SEG);
  for(let i=i0;i<=i1;i++){
    if(sr(i,91)<.4)continue;
    const x=i*SEG+sr(i,92)*SEG*.8-off,y=hillY(L,x)+10,hgt=60+sr(i,93)*60,r=17+sr(i,94)*12,col=`hsl(${S.hue+sr(i,95)*360},95%,62%)`;
    const sway=Math.sin(S.t*1.4+i)*.06,tx=x+Math.sin(sway)*hgt,ty=y-Math.cos(sway)*hgt;
    g.lineCap='round';
    g.beginPath();g.moveTo(x,y);g.lineTo(tx,ty);g.lineWidth=8;g.strokeStyle=INK;g.stroke();g.lineWidth=3.5;g.strokeStyle=PAPER;g.stroke();
    g.save();g.translate(tx+SHX*.6,ty+SHY*.6);g.beginPath();g.arc(0,0,r,0,TAU);g.fillStyle='rgba(26,6,48,.4)';g.fill();g.restore();
    g.save();g.translate(tx,ty);g.beginPath();g.arc(0,0,r,0,TAU);g.fillStyle=col;g.fill();
    g.save();g.clip();g.rotate(S.t*(i%2?1.5:-1.5));g.scale(r*1.05,r*1.05);g.lineWidth=5/r;g.strokeStyle='rgba(255,255,255,.85)';g.stroke(SPIRAL);g.restore();
    g.lineWidth=4;g.strokeStyle=INK;g.stroke();g.restore();
  }
}
function drawSky(){
  const h=S.hue,gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,`hsl(${h+255},75%,16%)`);gr.addColorStop(.5,`hsl(${h+290},78%,34%)`);gr.addColorStop(1,`hsl(${h+330},90%,56%)`);
  g.fillStyle=gr;g.fillRect(-40,-40,W+80,H+80);
}
function drawSun(){
  const cx=wrap(W*.78-S.cam*.03+450,W+900)-450,cy=H*.34;
  g.save();g.translate(cx,cy);g.rotate(S.t*.06);g.fillStyle='rgba(255,255,255,.05)';
  for(let i=0;i<20;i+=2){g.beginPath();g.moveTo(0,0);g.arc(0,0,1500,i/20*TAU,(i+1)/20*TAU);g.closePath();g.fill();}
  g.restore();
  for(let i=0;i<7;i++){
    const r=190-i*25,p=new Path2D(),dir=i%2?1:-1;
    for(let k=0;k<=72;k++){const a=k/72*TAU,rr=r+7*Math.sin(a*8+S.t*1.6*dir+i),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;k?p.lineTo(x,y):p.moveTo(x,y);}
    p.closePath();
    if(!i){g.save();g.translate(SHX,SHY);g.fillStyle='rgba(26,6,48,.4)';g.fill(p);g.restore();}
    g.fillStyle=`hsl(${S.hue+20+i*38},68%,${44+i*4}%)`;g.fill(p);g.lineWidth=4;g.strokeStyle=INK;g.stroke(p);
  }
  // rostinho sonolento

  g.lineWidth=3;g.beginPath();g.arc(x1+22,yb-4,4,.2,Math.PI-.2);g.stroke();g.beginPath();g.arc(x1+38,yb-4,4,.2,Math.PI-.2);g.stroke();g.beginPath();g.arc(x1+30,yb+6,6,.3,Math.PI-.3);g.stroke();
  g.save();g.translate(lerp(x0,x1,S.prog),yb-6+Math.sin(S.rt*4)*3);g.scale(.5,.5);drawPlane(0,false);g.restore();
  paperText('PONTOS  '+S.score,0,30,38,C.yellow);
  paperText((S.score>=S.best&&S.score>0?'NOVO RECORDE!  ':'RECORDE  ')+S.best,0,78,24,C.lime);
  if(t>2.7){const p=1+.06*Math.sin(S.rt*5);g.save();g.translate(0,140);g.scale(p,p);paperText('ESPAÇO PARA VOAR DE NOVO',0,0,30,C.violet);g.restore();}
  g.restore();
}
function drawPause(){
  g.fillStyle='rgba(15,4,30,.55)';g.fillRect(0,0,W,H);X=g;SHD=false;
  g.save();g.translate(W/2,H/2);g.rotate(.02);piece(strips().pause,PAPER,'#e8d5ae',40,5);
  paperText('PAUSA',0,-20,64,C.cyan);g.font=`20px ${FONT}`;g.fillStyle=INK;g.textAlign='center';g.fillText('P PARA CONTINUAR',0,45);g.restore();
}
// transição em íris, como no fim dos curtas dos anos 30
function drawWipe(){
  const w=S.wipe;if(!w)return;
  const R0=Math.hypot(W,H)/2+30,r=w.ph==='in'?lerp(R0,0,E.inCubic(Math.min(1,w.t/.5))):lerp(0,R0,E.outCubic(Math.min(1,w.t/.8)));
  const cx=W/2,cy=H/2,p=new Path2D();p.rect(-20,-20,W+40,H+40);
  if(r>1){const c=new Path2D();for(let k=0;k<=72;k++){const a=k/72*TAU,rr=r+Math.sin(a*9+S.rt*6)*Math.min(6,r*.05);k?c.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr):c.moveTo(cx+rr,cy);}
    c.closePath();p.addPath(c);g.fillStyle='#0b0514';g.fill(p,'evenodd');g.lineWidth=7;g.strokeStyle='#24093d';g.stroke(c);}
  else{g.fillStyle='#0b0514';g.fill(p);}
}

// ============================================================ render
function render(){
  const sh=S.shake,ox=(Math.random()*2-1)*sh,oy=(Math.random()*2-1)*sh;
  for(const c of [g,sg]){c.lineJoin='round';c.lineCap='round';}
  X=g;SHD=false;BC=0;
  g.setTransform(RS,0,0,RS,ox*RS*.3,oy*RS*.3);
  drawSky();drawSun();drawPlanets();drawStars();drawSwirls();
  g.setTransform(RS,0,0,RS,ox*RS*.7,oy*RS*.7);
  drawClouds();drawHill(HILLS[0]);drawLollipops(HILLS[1]);drawHill(HILLS[1]);drawHill(HILLS[2]);
  g.setTransform(RS,0,0,RS,ox*RS,oy*RS);
  // sombras duras unificadas em uma camada só
  sg.setTransform(1,0,0,1,0,0);sg.clearRect(0,0,shadowCv.width,shadowCv.height);sg.setTransform(RS,0,0,RS,ox*RS,oy*RS);
  X=sg;SHD=true;drawEntities();
  g.save();g.setTransform(1,0,0,1,0,0);g.globalAlpha=.42;g.drawImage(shadowCv,SHX*RS,SHY*RS);g.restore();
  X=g;SHD=false;BC=0;drawEntities();drawParts();
  drawHill(FG);
  // textura de papel por cima de tudo
  g.setTransform(RS,0,0,RS,0,0);
  if(!paperPat)paperPat=g.createPattern(paperTex,'repeat');
  g.save();g.globalCompositeOperation='multiply';g.globalAlpha=.55;g.fillStyle=paperPat;g.fillRect(0,0,W,H);g.restore();
  // cartelas: camada própria, recebe só a compensação óptica (sem aberração cromática)
  g=hudCtx;X=g;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,hudCv.width,hudCv.height);g.setTransform(RS,0,0,RS,0,0);g.lineJoin='round';g.lineCap='round';
  if(S.mode==='title')drawTitle();
  else{if(S.mode==='play')hud();drawBanner();if(S.mode==='over')drawOver();if(S.paused)drawPause();}
  drawWipe();
  g=sceneCtx;X=g;
  if(post)post.render(scene,hudCv,S.rt,1+S.ca*.5,S.flash);
  else fallback();
}

// ============================================================ pós-processamento (WebGL): película de cinema velho
function makePost(cv){
  let gl=null;try{gl=cv.getContext('webgl',{alpha:false,antialias:false,premultipliedAlpha:false});}catch(e){}
  if(!gl)return null;
  const vs='attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
  const fs=`precision mediump float;
varying vec2 uv;uniform sampler2D tex,hud;uniform float time,ca,flash;uniform vec2 texel;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec3 smp(vec2 u){return texture2D(tex,u).rgb;}
void main(){
  vec2 c=uv-.5;vec2 ac=c*vec2(16./9.,1.);float r2=dot(ac,ac);
  /* compensação óptica: leve barril + reescala, as laterais "abraçam" o centro */
  vec2 u=c*(1.+.045*r2+.012*r2*r2)*.94+.5;
  /* aberração cromática radial, mais forte nas bordas */
  vec2 dir=c*ca*(.0011+.006*r2);
  vec3 col=vec3(smp(u+dir).r,smp(u).g,smp(u-dir).b);
  /* bloom barato para o neon */
  vec3 bl=vec3(0.);
  for(int i=0;i<8;i++){float a=float(i)*.785398;vec2 o=vec2(cos(a),sin(a))*texel*7.;bl+=max(smp(u+o)-.6,0.)+max(smp(u+o*2.3)-.6,0.)*.7;}
  col+=bl*.17;
  /* vinheta só no mundo */
  float v=1.-smoothstep(.35,1.05,length(c*vec2(1.25,1.45)));
  col*=mix(.38,1.,v);
  /* cartelas: mesma lente, cores alinhadas */
  vec4 hc=texture2D(hud,u);col=mix(col,hc.rgb,hc.a);
  /* película: tom sépia leve, poeira, fiapos e riscos verticais a 24 quadros */
  float t=floor(time*24.);
  vec3 sep=vec3(dot(col,vec3(.393,.769,.189)),dot(col,vec3(.349,.686,.168)),dot(col,vec3(.272,.534,.131)));
  col=mix(col,sep,.14);
  float dust=0.;
  for(int i=0;i<5;i++){float fi=float(i);vec2 dp=vec2(h(vec2(t,fi*3.1)),h(vec2(t,fi*7.7)));float rr=.0015+.004*h(vec2(t,fi+11.));
    vec2 dd=(uv-dp)*vec2(16./9.,1.);if(h(vec2(t,fi+20.))>.55&&length(dd)<rr)dust=1.;}
  vec2 hp=vec2(h(vec2(t,31.)),h(vec2(t,37.)));vec2 hd=(uv-hp)*vec2(16./9.,1.);
  if(h(vec2(t,41.))>.86&&abs(hd.y-.04*sin(hd.x*60.))<.0012&&abs(hd.x)<.035)dust=1.;
  col=mix(col,vec3(.07,.04,.03),dust*.8);
  vec2 gp=floor(gl_FragCoord.xy/1.6);
  float n=h(gp+t*13.17)-.5,n2=h(floor(gp*.5)+t*7.3)-.5;
  col+=(n*.17+n2*.07)*(1.15-dot(col,vec3(.33)));
  col*=1.+(h(vec2(t,3.))-.5)*.05;
  float sx=h(vec2(t,1.));if(h(vec2(t,9.))>.7&&abs(uv.x-sx)<.0009)col*=.6;
  float sx2=h(vec2(floor(time*3.),5.));if(h(vec2(floor(time*3.),6.))>.6&&abs(uv.x-sx2)<.0006)col=mix(col,vec3(1.,.97,.9),.2);
  col=mix(col,col*vec3(1.04,.98,.92),.5)+flash;
  gl_FragColor=vec4(col,1.);
}`;
  const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));return null;}return s;};
  const v=sh(gl.VERTEX_SHADER,vs),f=sh(gl.FRAGMENT_SHADER,fs);if(!v||!f)return null;
  const pr=gl.createProgram();gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return null;
  gl.useProgram(pr);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const mkTex=unit=>{gl.activeTexture(gl.TEXTURE0+unit);const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;};
  const tex=mkTex(0),htex=mkTex(1);
  gl.uniform1i(gl.getUniformLocation(pr,'tex'),0);gl.uniform1i(gl.getUniformLocation(pr,'hud'),1);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  const U={time:gl.getUniformLocation(pr,'time'),ca:gl.getUniformLocation(pr,'ca'),flash:gl.getUniformLocation(pr,'flash'),texel:gl.getUniformLocation(pr,'texel')};
  return{render(src,hudSrc,t,ca,flash){
    gl.viewport(0,0,cv.width,cv.height);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,htex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,hudSrc);
    gl.uniform1f(U.time,t);gl.uniform1f(U.ca,ca);gl.uniform1f(U.flash,flash);gl.uniform2f(U.texel,1/src.width,1/src.height);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }};
}
function fallback(){
  if(!vctx)vctx=view.getContext('2d');
  const w=view.width,h=view.height;vctx.drawImage(scene,0,0,w,h);vctx.drawImage(hudCv,0,0,w,h);
  const gr=vctx.createRadialGradient(w/2,h/2,h*.3,w/2,h/2,h*.95);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(10,0,25,.6)');
  vctx.fillStyle=gr;vctx.fillRect(0,0,w,h);
  if(S.flash>.01){vctx.fillStyle=`rgba(255,255,255,${S.flash})`;vctx.fillRect(0,0,w,h);}
}

// ============================================================ entrada
function pressStart(){
  if(S.wipe)return;
  if(S.paused){S.paused=false;return;}
  if(S.mode==='title'||(S.mode==='over'&&S.overT>2.7))transition(()=>{reset();S.mode='play';});
}
addEventListener('keydown',e=>{
  const k=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft','ShiftRight'].includes(k))e.preventDefault();
  A.init();keys[k]=true;if(e.repeat)return;
  if(k==='KeyM')A.mute();
  if((k==='KeyP'||k==='Escape')&&S.mode==='play'&&!S.wipe){S.paused=!S.paused;return;}
  if(S.mode==='play'&&!S.paused){
    if(k==='KeyX')special();
    if(k==='KeyC')parry();
    if(k==='ShiftLeft'||k==='ShiftRight'||k==='KeyQ')swap();
  }
  if(k==='Space'||k==='Enter'||k==='KeyZ'||(k==='KeyX'&&S.mode!=='play'))pressStart();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;fireHeld=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='play')S.paused=true;});
const hold=(el,on,off)=>{
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}el.classList.add('down');A.init();on();});
  const up=()=>{el.classList.remove('down');off();};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
};
const nop=()=>{};
hold(document.getElementById('fire'),()=>{fireHeld=true;pressStart();},()=>{fireHeld=false;});
hold(document.getElementById('ex'),()=>{if(S.mode==='play'&&!S.paused)special();else pressStart();},nop);
hold(document.getElementById('parry'),()=>{if(!S.paused)parry();},nop);
hold(document.getElementById('swap'),()=>{if(!S.paused)swap();},nop);
document.querySelectorAll('#pad .pbtn').forEach(b=>hold(b,()=>{keys[b.dataset.k]=true;},()=>{keys[b.dataset.k]=false;}));
if(matchMedia('(pointer: coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');
addEventListener('touchstart',()=>document.body.classList.add('touch'),{once:true,passive:true});
view.addEventListener('pointerdown',()=>{A.init();});

// ============================================================ loop
resize();addEventListener('resize',resize);
post=makePost(view);
if(document.fonts&&document.fonts.load)document.fonts.load(`40px "Luckiest Guy"`).catch(()=>{});
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  update(dt);render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__shooter={S,pl,enemies,eb,notes,spawnBoss,spawnWave,twins,metro,horn,special,superMode,parry,swap,reset,HM};
})();
</script>
